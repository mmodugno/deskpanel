<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0a1f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>deskpanel</title>
</head>
<body>
  <div class="glow" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="bar">
    <div>
      <div id="greeting" class="greeting">Hola</div>
      <div id="host" class="host"></div>
    </div>
    <div class="bar-right">
      <button id="theme" class="chip theme" type="button" aria-label="Cambiar tema"><i></i><b id="themeName">Violeta</b></button>
      <span id="link" class="chip" data-state="connecting"><i></i><b>conectando</b></span>
    </div>
  </header>

  <main class="board">
    <section class="card clock" aria-label="Hora">
      <div id="time" class="time">--:--</div>
      <div id="date" class="date"></div>
    </section>

    <section class="card gauge" aria-label="Procesador">
      <div class="ring">
        <svg viewBox="0 0 120 120" role="img" aria-label="Uso de CPU">
          <defs>
            <linearGradient id="g1" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" class="g-a"/><stop offset="1" class="g-b"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="60" cy="60" r="46" pathLength="100"/>
          <circle id="cpuArc" class="arc" cx="60" cy="60" r="46" pathLength="100"/>
        </svg>
        <div class="ring-text"><span id="cpuValue">--</span><small>%</small></div>
      </div>
      <div class="label">Procesador</div>
    </section>

    <section class="card mem" aria-label="Memoria">
      <div class="label">Memoria</div>
      <div id="memBig" class="big">--<small>%</small></div>
      <div class="meter"><div id="memFill" class="fill"></div></div>
      <div id="memText" class="sub">-- / -- GB</div>
    </section>

    <section class="card chart" aria-label="Historial de uso">
      <div class="chart-head">
        <span class="label">Últimos minutos</span>
        <span class="legend"><i class="k-cpu"></i>CPU <i class="k-mem"></i>Memoria</span>
      </div>
      <svg id="chart" viewBox="0 0 300 100" preserveAspectRatio="none" role="img" aria-label="CPU y memoria en el tiempo">
        <defs>
          <linearGradient id="areaCpu" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" class="s-a"/><stop offset="1" class="s-b"/>
          </linearGradient>
        </defs>
        <path id="areaPath" fill="url(#areaCpu)"/>
        <path id="memPath" class="line-mem"/>
        <path id="cpuPath" class="line-cpu"/>
      </svg>
    </section>

    <section class="card activity" aria-label="Actividad de Claude Code hoy">
      <div class="label">Claude Code hoy</div>
      <div id="bars" class="bars"></div>
      <div class="hours"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>23h</span></div>
    </section>

    <section class="card claude" aria-label="Sesiones de Claude Code">
      <div class="label">Claude Code</div>
      <ul id="sessions" class="sessions"></ul>
    </section>

    <section id="weatherCell" class="card weather" aria-label="Clima" hidden>
      <div class="label" id="weatherText"></div>
      <div id="weatherTemp" class="big"></div>
    </section>
  </main>

  <div id="perm" class="perm" role="alertdialog" aria-modal="true" aria-labelledby="permTitle" hidden>
    <div class="perm-card">
      <div class="perm-head">
        <span class="perm-badge">Claude Code necesita tu permiso</span>
        <span id="permCount" class="perm-count" hidden></span>
      </div>
      <h2 id="permTitle" class="perm-title"></h2>
      <pre id="permDetail" class="perm-detail"></pre>
      <div class="perm-timer"><div id="permTimer"></div></div>
      <div class="perm-actions">
        <button id="permDeny" class="btn deny" type="button">Denegar</button>
        <button id="permAllow" class="btn allow" type="button">Permitir</button>
      </div>
    </div>
  </div>

  <button id="arm" class="arm" type="button">Tocá para activar el sonido y mantener la pantalla encendida</button>
  <div id="flash" class="flash" aria-hidden="true"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
